name: pushgiant

services:
  admin:
    build:
      context: ..
      dockerfile: deploy/docker/admin.Dockerfile
    env_file:
      - ../.env
    depends_on:
      push-api:
        condition: service_started
    ports:
      - "127.0.0.1:3101:3000"
    restart: unless-stopped

  push-api:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  push-worker:
    build:
      context: ..
      dockerfile: deploy/docker/worker.Dockerfile
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  push-scheduler:
    build:
      context: ..
      dockerfile: deploy/docker/scheduler.Dockerfile
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pushgiant
      POSTGRES_USER: pushgiant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pushgiant -d pushgiant"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
    name: pushgiant_postgres_data
  redis-data:
    name: pushgiant_redis_data
