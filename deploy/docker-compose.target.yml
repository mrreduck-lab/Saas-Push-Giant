services:
  reverse-proxy:
    image: caddy:2
    depends_on:
      - push-api
      - admin
    ports:
      - "80:80"
      - "443:443"

  admin:
    build:
      context: ..
      dockerfile: deploy/docker/admin.Dockerfile
    env_file:
      - ../.env
    depends_on:
      - push-api

  push-api:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis

  push-worker:
    build:
      context: ..
      dockerfile: deploy/docker/worker.Dockerfile
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis

  push-scheduler:
    build:
      context: ..
      dockerfile: deploy/docker/scheduler.Dockerfile
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pushgiant
      POSTGRES_USER: pushgiant
      POSTGRES_PASSWORD: pushgiant
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
