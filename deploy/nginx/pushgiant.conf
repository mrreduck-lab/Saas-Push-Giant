server {
    listen 80;
    listen [::]:80;
    server_name pushgiant.ru www.pushgiant.ru app.pushgiant.ru api.pushgiant.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pushgiant.ru www.pushgiant.ru app.pushgiant.ru;

    ssl_certificate /etc/nginx/tls/pushgiant.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/pushgiant.ru/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.pushgiant.ru;

    ssl_certificate /etc/nginx/tls/pushgiant.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/pushgiant.ru/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
