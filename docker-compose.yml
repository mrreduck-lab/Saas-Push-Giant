services:
  reverse-proxy:
    image: caddy:2
    depends_on:
      - push-api
      - admin
    ports:
      - "8080:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro

  admin:
    build:
      context: .
      dockerfile: deploy/docker/admin.Dockerfile
    env_file:
      - .env
    environment:
      PORT: "3000"
    depends_on:
      - push-api

  push-api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    env_file:
      - .env
    environment:
      API_PORT: "3100"
      DATABASE_URL: postgres://pushgiant:pushgiant@postgres:5432/pushgiant
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  push-worker:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://pushgiant:pushgiant@postgres:5432/pushgiant
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: "10"
      WEB_PUSH_SEND_CONCURRENCY: "25"
      CAMPAIGN_BATCH_SIZE: "500"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  push-scheduler:
    build:
      context: .
      dockerfile: deploy/docker/scheduler.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://pushgiant:pushgiant@postgres:5432/pushgiant
      REDIS_URL: redis://redis:6379
      SCHEDULER_INTERVAL_MS: "60000"
      SCHEDULER_CAMPAIGN_LIMIT: "100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pushgiant
      POSTGRES_USER: pushgiant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pushgiant}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pushgiant -d pushgiant"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
