name: Deploy production

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: pushgiant-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            COMPOSE="docker compose -p pushgiant -f deploy/docker-compose.target.yml"

            cd "$APP_DIR"
            git fetch --prune origin main
            git checkout main
            git reset --hard origin/main

            test -f .env
            $COMPOSE config --quiet
            $COMPOSE pull postgres redis
            $COMPOSE up -d postgres redis
            $COMPOSE build admin push-api push-worker push-scheduler
            $COMPOSE run --rm push-api npm run migrate -w @pushgiant/api
            $COMPOSE up -d --remove-orphans

            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:3101/ >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                $COMPOSE ps
                $COMPOSE logs --tail=200 admin push-api
                exit 1
              fi
              sleep 2
            done

            $COMPOSE ps
            docker image prune -f
