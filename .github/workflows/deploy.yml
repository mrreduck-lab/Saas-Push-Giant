name: Deploy production

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: pushgiant-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.DEPLOY_PATH }}"

            cd "$APP_DIR"
            git fetch --prune origin main
            git checkout main
            git reset --hard origin/main

            export PUSHGIANT_ENV_FILE="$(readlink -f ../.env)"
            export NEXT_PUBLIC_GIT_SHA="${{ github.sha }}"
            test -f "$PUSHGIANT_ENV_FILE"
            COMPOSE="docker compose --env-file $PUSHGIANT_ENV_FILE -p pushgiant -f deploy/docker-compose.target.yml"

            $COMPOSE config --quiet
            $COMPOSE pull postgres redis
            $COMPOSE up -d postgres redis
            $COMPOSE build admin push-api push-worker push-scheduler
            $COMPOSE run --rm push-api npm run migrate -w @pushgiant/api
            $COMPOSE run --rm push-api npm run seed:demo -w @pushgiant/api
            $COMPOSE up -d --remove-orphans

            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:3101/ >/dev/null \
                && curl --fail --silent --show-error http://127.0.0.1:3100/readyz >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                $COMPOSE ps
                $COMPOSE logs --tail=200 admin push-api
                exit 1
              fi
              sleep 2
            done

            if [ -d /etc/nginx/sites-available ]; then
              if [ "$(id -u)" -eq 0 ]; then
                SUDO=""
              elif sudo -n true 2>/dev/null; then
                SUDO="sudo"
              else
                SUDO=""
              fi

              if [ -n "$SUDO" ] || [ "$(id -u)" -eq 0 ]; then
                $SUDO cp deploy/nginx/pushgiant.conf /etc/nginx/sites-available/pushgiant
                $SUDO ln -sfn /etc/nginx/sites-available/pushgiant /etc/nginx/sites-enabled/pushgiant
                $SUDO nginx -t
                $SUDO systemctl reload nginx
              else
                echo "Skipping nginx config install: deploy user has no passwordless sudo."
              fi
            fi

            $COMPOSE ps
            docker image prune -f

      - name: Public HTTPS smoke
        shell: bash
        run: |
          set -euo pipefail

          html="$(mktemp)"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
            https://pushgiant.ru/ -o "$html"

          css_path="$(grep -oE '/_next/static/css/[^"]+\.css' "$html" | head -n 1 || true)"
          if [ -z "$css_path" ]; then
            echo "No Next.js CSS asset found in public HTML." >&2
            exit 1
          fi

          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
            "https://pushgiant.ru${css_path}" -o /dev/null
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 \
            https://api.pushgiant.ru/readyz -o /dev/null
